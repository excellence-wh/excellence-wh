name: update-profile

on:
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_profile.py
      - name: Commit and push
        run: |
          git config user.name "excellence-wh bot"
          git config user.email "excellence.wh@outlook.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(profile): refresh stats"
            git push
          fi
